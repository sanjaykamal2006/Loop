name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 2 days at 06:00 UTC (well within the 7-day inactivity limit)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Prevent Inactivity Pause
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Activity
        run: |
          echo "Sending keep-alive ping to Supabase..."
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY="sb_publishable_2KCVfEqwyTQbGu4ajrZGyQ_oeKs73S0"
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://molpzciemegendacaglt.supabase.co/rest/v1/loops?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Supabase responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Keep-alive ping completed successfully."
          else
            echo "Keep-alive ping failed with status $HTTP_STATUS" >&2
            exit 1
          fi
