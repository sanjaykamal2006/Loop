name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: loop_test
          POSTGRES_PASSWORD: loop_test_password
          POSTGRES_DB: loop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./Loop-App-2-codebase

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./Loop-App-2-codebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Dependency Integrity
        run: npm ls --all --omit=optional

      - name: Lint
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm run test:run

      - name: Initialize Database Contract Schema
        run: PGPASSWORD=loop_test_password psql -h localhost -U loop_test -d loop_test_db -f tests/integration/schema_contract_init.sql

      - name: Run Live Database Contract Tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: "postgresql://loop_test:loop_test_password@localhost:5432/loop_test_db"

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
