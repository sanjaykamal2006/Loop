name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI never writes to the repository.
permissions:
  contents: read

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: loop_test
          POSTGRES_PASSWORD: loop_test_password
          POSTGRES_DB: loop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./Loop-App-2-codebase

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./Loop-App-2-codebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Dependency Integrity
        run: npm ls --all --omit=optional

      - name: Lint
        run: npm run lint

      - name: Typecheck (app + tests)
        run: npm run typecheck

      - name: Run Unit & Component Tests
        run: npm run test:run

      - name: Verify Code Coverage Thresholds
        run: npm run test:coverage

      - name: Apply Real Database Migrations
        run: node scripts/run-migrations.js
        env:
          TEST_DATABASE_URL: "postgresql://loop_test:loop_test_password@localhost:5432/loop_test_db"


      - name: Run Live Database Contract Tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: "postgresql://loop_test:loop_test_password@localhost:5432/loop_test_db"

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
